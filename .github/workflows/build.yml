name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile and run logic tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\Build-Companion.ps1
