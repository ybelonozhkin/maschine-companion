name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build launcher without the MIDI bridge
        shell: powershell
        run: .\scripts\Build-Companion.ps1
      - name: Build diagnostic probe and run its self-tests
        shell: powershell
        run: .\diagnostics\Build-Probe.ps1

  distribution:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - name: Test Live script
        run: python -m unittest discover -s tests -p "test_ableton_*.py"
      - name: Build native MIDI bridge and companion
        shell: powershell
        run: .\scripts\Build-Ableton.ps1
      - name: Prepare portable build
        shell: powershell
        run: .\scripts\Prepare-Distribution.ps1 -Archive
      - name: Verify distribution and script installation
        shell: powershell
        run: .\tests\Test-Distribution.ps1
      - name: Upload Windows x64 build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 30

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [launcher, distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x64
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt --verify-tag --draft --title "$RELEASE_TAG" --notes-file release/RELEASE-NOTES.md
