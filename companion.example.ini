# Default configuration
Executable=C:\Program Files\Native Instruments\Maschine 3\Maschine 3.exe
Arguments=
HoldMilliseconds=1200
StandbyLed=true
StandbyBrightness=Dim
DisplayDim=false
EnableClose=true
CloseHoldMilliseconds=2000

# Optional native HID integration for Ableton Live
EnableAbleton=false

# Experimental automatic handoff with one Maschine VST instance. Restart after changing.
EnableNativeHandoff=false

# Pause companion while any matching DAW process is running
PauseWhenDawRunning=true
DawProcesses=Ableton Live*;FL;FL64;FL (scaled);FL64 (scaled);FL (compatible memory);reaper;Cubase*;Nuendo*;Studio One;Bitwig Studio;ProTools;Cakewalk;Sonar

# Optional MIDI input names for activity lights from other controllers, separated by ;.
# Wildcards (*) are supported. Leave empty to observe no additional inputs.
MidiActivityInputs=

# Velocity used by Fixed Vel in Ableton integration (1..127).
FixedVelocity=127
