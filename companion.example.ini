# Default configuration
Executable=C:\Program Files\Native Instruments\Maschine 3\Maschine 3.exe
Arguments=
HoldMilliseconds=1200
StandbyLed=true
StandbyBrightness=Dim
DisplayDim=false
EnableClose=true
CloseHoldMilliseconds=2000

# Enable MIDI/controller profiles; Basic and Control surface are selected in the tray.
EnableAbleton=false

# Initial Basic clock settings; per-device overrides are saved in devices.ini. Internal or External. External input receives clock from the music application.
ClockSource=Internal
ClockInput=Mikro Companion Send
BasicTempo=120

# Experimental handoff with Maschine VSTs; choose between instances manually. Restart after changing.
EnableNativeHandoff=false

# Pause companion while any matching DAW process is running
PauseWhenDawRunning=true
DawProcesses=Ableton Live*;FL;FL64;FL (scaled);FL64 (scaled);FL (compatible memory);reaper;Cubase*;Nuendo*;Studio One;Bitwig Studio;ProTools;Cakewalk;Sonar

# Optional MIDI input names for activity lights from other controllers, separated by ;.
# Wildcards (*) are supported. Leave empty to observe no additional inputs.
MidiActivityInputs=

# Initial Fixed Vel value (1..127); device settings are saved in devices.ini.
FixedVelocity=127
